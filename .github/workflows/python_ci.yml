name: Python CI

env:
  APP_ENV: testing

on:

  push:

    branches: [master]


jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4

      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: '3.11'


      - name: Show environment

        run: echo "Current environment is $APP_ENV"


      - name: Check GitHub Secret

        env:
          MY_SECRET: ${{ secrets.MY_TEST_SECRET }}
        run: |
          if [ -n "$MY_SECRET" ]; then
            echo "Secret is available"
          else
            echo "Secret is missing"
            exit 1
          fi


      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          python -m pip install pytest flake8

      - name: Run Pytest

        run: python -m pytest -v

      - name: Run Flake8

        run: python -m flake8 test_calculator.py
